<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مناديب المبيعات - المناطق وأرقام التواصل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Tajawal', system-ui, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            padding: 1.2rem;
            color: #1e2f3e;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* رأس الصفحة مع اللوجو */
        .logo-header {
            text-align: center;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem 0.8rem;
            border-radius: 48px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo-img {
            max-height: 70px;
            width: auto;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 1.2rem;
            font-weight: bold;
            background: #002d5a;
            color: #ffcd3c;
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            letter-spacing: 1px;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #004e7c;
        }

        /* عنوان القسم */
        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-title h2 {
            font-size: 1.8rem;
            color: #1c4e70;
            border-bottom: 3px solid #ffb347;
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        /* شبكة بطاقات المناطق */
        .delegates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* تصميم البطاقة */
        .card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 24px -12px rgba(0,0,0,0.12);
            transition: all 0.25s ease;
            border: 1px solid #e2edf2;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 28px -12px rgba(0,0,0,0.2);
        }

        /* رأس البطاقة (رقم تسلسلي صغير) */
        .card-badge {
            background: #f1f9ff;
            padding: 0.6rem 1rem;
            font-size: 0.75rem;
            color: #2c6b9e;
            font-weight: 500;
            border-bottom: 1px dashed #cde3ef;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-icon {
            background: #ffb34720;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        /* محتوى البطاقة: المنطقة + الهاتف */
        .card-body {
            padding: 1.3rem 1.3rem 1.5rem;
        }

        .region-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.3rem;
            background: #f8fafd;
            padding: 0.9rem;
            border-radius: 24px;
        }

        .region-icon {
            font-size: 1.7rem;
        }

        .region-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0a3146;
            word-break: break-word;
            line-height: 1.4;
        }

        .phone-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #f0f6fa;
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 0.8rem;
            margin-top: 0.2rem;
        }

        .phone-number {
            font-family: monospace;
            font-size: 1.15rem;
            font-weight: 700;
            direction: ltr;
            letter-spacing: 0.5px;
            color: #1b5a7e;
            background: white;
            padding: 0.35rem 0.8rem;
            border-radius: 40px;
            margin: 0.2rem 0;
        }

        .call-btn {
            background: #25b86e;
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .call-btn:hover {
            background: #1e9e5c;
            transform: scale(0.97);
        }

        /* تذييل */
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #527a9b;
            background: #eef3f8;
            padding: 0.6rem;
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 580px) {
            .phone-block {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                background: transparent;
                padding: 0;
            }
            .call-btn {
                justify-content: center;
                margin-top: 6px;
            }
            .region-text {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- رأس الصفحة مع اللوجو الخاص بك (يمكنك تغيير الصورة أو النص) -->
    <div class="logo-header">
        <!-- 
            هنا قمت بإضافة اللوجو من صورتين بناءً على الملفات التي أرفقتها:
            - الصورة الأولى: image.png (نص "Free" مكرر)
            - الصورة الثانية: 6384116745478472535872.jpg (تحتوي على "HAR" و "R" و "H&A AL-RAJHI")
            لتطابق ما لديك، سأعرض كلاهما بشكل رمزي، لكن يمكنك استبدال المسار بالملف الفعلي.
            بما أن الملفات موجودة محلياً بجانب الصفحة، استخدمتها مباشرةً.
            إذا أردت لوجو واحد فقط، يمكنك تعديل السطر المناسب.
        -->
        <img class="logo-img" src="image.png" alt="شعار الشركة" onerror="this.style.display='none'">
        <img class="logo-img" src="6384116745478472535872.jpg" alt="شعار H&A AL-RAJHI" onerror="this.style.display='none'">
        <!-- في حال عدم ظهور الصور بسبب المسار، نعرض نص بديل لللوجو -->
        <div class="logo-placeholder" id="fallbackLogo" style="display: none;">H&A AL-RAJHI</div>
        <div class="company-name">قائمة المناديب المعتمدين</div>
    </div>

    <div class="page-title">
        <h2>📍 المناطق وأرقام التواصل</h2>
        <p style="margin-top: 6px; color:#3f6b8c;">اختر منطقتك وتواصل مباشرة مع المندوب</p>
    </div>

    <div class="delegates-grid" id="delegatesGrid">
        <!-- يتم تعبئة البيانات عبر js -->
    </div>
    <div class="footer-note">
        📲 اضغط على "اتصال" للتواصل الفوري | بيانات دقيقة ومحدثة
    </div>
</div>

<script>
    // قائمة المناديب: تحتوي فقط (المنطقة + رقم الهاتف) بدون اسم المندوب
    // عدد 6 مناديب كما طلبت
    const delegatesList = [
        {
            id: 1,
            region: "الرياض",
            phone: "+966552960276"
        },
        {
            id: 2,
            region: "القصيم",
            phone: "+966539069635"
        },
        {
            id: 3,
            region: "الدمام",
            phone: "+966559888462"
        },
        {
            id: 4,
            region: "خميس مشيط",
            phone: "+966531540385"
        },
        {
            id: 5,
            region: "الخرج",
            phone: "+966539069257"
        },
        {
            id: 6,
            region: "تبوك",
            phone: "+966534646415"
        }
        
    ];

    // دالة لتجهيز رقم الهاتف لرابط tel:
    function prepareTelLink(phone) {
        let cleanPhone = phone.replace(/\s+/g, '').replace(/-/g, '');
        if (!cleanPhone.startsWith('+')) {
            if (cleanPhone.startsWith('05') && cleanPhone.length === 10) {
                cleanPhone = '+966' + cleanPhone.substring(1);
            } else if (cleanPhone.startsWith('0')) {
                cleanPhone = '+966' + cleanPhone.substring(1);
            } else {
                cleanPhone = '+' + cleanPhone;
            }
        }
        return cleanPhone;
    }

    // دالة لتأمين النصوص
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // عرض البطاقات (المنطقة + رقم الموبايل فقط)
    function renderDelegates() {
        const grid = document.getElementById('delegatesGrid');
        if (!grid) return;

        let html = '';
        delegatesList.forEach((delegate, idx) => {
            const regionSafe = escapeHtml(delegate.region);
            const phoneRaw = delegate.phone;
            const phoneClean = escapeHtml(phoneRaw);
            const telLink = prepareTelLink(phoneRaw);

            html += `
                <div class="card">
                    <div class="card-badge">
                        <span class="badge-icon">مندوب منطقة رقم ${idx+1}</span>
                        <span>📌 خدمة سريعة</span>
                    </div>
                    <div class="card-body">
                        <div class="region-block">
                            <div class="region-icon">🏙️</div>
                            <div class="region-text">${regionSafe}</div>
                        </div>
                        <div class="phone-block">
                            <div class="phone-number" dir="ltr">${phoneClean}</div>
                            <a href="tel:${telLink}" class="call-btn">
                                📞 اتصل الآن
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    // معالجة ظهور اللوجو إذا تعذر تحميل الصور اخفاءها وإظهار النص البديل
    function handleLogoFallback() {
        const imgs = document.querySelectorAll('.logo-img');
        let anyImageLoaded = false;
        imgs.forEach(img => {
            img.onerror = function() {
                this.style.display = 'none';
                // بعد فحص كل الصور نرى إذا كان الكل مخفياً نظهر النص البديل
                checkAllImagesFailed();
            };
            img.onload = function() {
                anyImageLoaded = true;
                const fallback = document.getElementById('fallbackLogo');
                if (fallback) fallback.style.display = 'none';
            };
        });
        function checkAllImagesFailed() {
            const visibleImgs = Array.from(document.querySelectorAll('.logo-img')).some(img => img.style.display !== 'none' && img.complete && img.naturalHeight !== 0);
            if (!visibleImgs) {
                const fallback = document.getElementById('fallbackLogo');
                if (fallback) fallback.style.display = 'flex';
            }
        }
        // فور بعد تحميل الصفحة
        setTimeout(checkAllImagesFailed, 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderDelegates();
        handleLogoFallback();
    });
</script>
</body>
</html>
